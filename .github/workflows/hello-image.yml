name: hello image

# Builds examples/hello and pushes ghcr.io/heimvio/ext-hello.
# Runs on a tag hello-v<version> or by hand; heimvio's operator registers the
# printed digest (api.extension_register), never a tag.
on:
  push:
    tags: ['hello-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heimvio/ext-hello
          tags: |
            type=match,pattern=hello-v(.*),group=1
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/hello/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # read:packages for @heimvio/* — GITHUBPACKAGESTOKEN if set (a token that may read
          # packages of other repositories), otherwise this run's token.
          secrets: |
            npm_token=${{ secrets.GITHUBPACKAGESTOKEN || secrets.GITHUB_TOKEN }}

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ghcr.io/heimvio/ext-hello@${DIGEST}"
            echo
            echo "Register (heimvio operator):"
            echo
            echo '```sql'
            echo "SELECT api.extension_register('hello', 'Hello', 'Beispiel-Erweiterung: zeigt Benutzer, Organisation und Rollen.', 'ghcr.io/heimvio/ext-hello@${DIGEST}', '${GITHUB_REF_NAME}');"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
